name: "刻历"
version: "0.10.1"
slug: "mono_calendar"
description: "Data, device controls and an LLM assistant for e-ink calendar"
url: "https://github.com/l-ziming/mono-calendar"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: experimental
init: true
homeassistant_api: true
map:
  - type: app_config
    read_only: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Authenticated data and action API for the display"
watchdog: "tcp://[HOST]:[PORT:8080]"
webui: "http://[HOST]:[PORT:8080]/"
options:
  display_token: null
  timezone: "Asia/Shanghai"
  temperature_unit: "°C"
  city: ""
  week_start: 1
  aqi_standard: "US"
  aqi_input_standard: "US"
  aqi_cn_period: ""
  assistant_prompt: ""
  llm_model: "deepseek-flash"
  llm_thinking: true
  llm_reasoning_effort: "high"
  llm_max_tokens: 0
  llm_api_key: ""
  llm_base_url: "https://api.deepseek.com"
  calendars: []
  assistant_entities: []
  assistant_presence_entities: []
  assistant_news_mode: "morning_and_major"
  assistant_news_interval_hours: 6
  assistant_screen_times:
    - "06:30"
    - "11:30"
    - "16:30"
    - "21:00"
  assistant_screen_min_minutes: 15
  assistant_screen_max_per_hour: 4
  assistant_screen_quiet_start: "23:00"
  assistant_screen_quiet_end: "06:00"
  assistant_context_tokens: 32768
  assistant_memory_ttl_days: 14
  entities:
    climate: "climate.living_room"
    living_temperature: "climate.living_room#current_temperature"
    living_humidity: "climate.living_room#current_humidity"
    outdoor_temperature: ""
    outdoor_humidity: ""
    outdoor_aqi: ""
    outdoor_pm25_24h: ""
    outdoor_pm10_24h: ""
    outdoor_aqi_primary: ""
    weather: ""
    weather_alert: ""
    assistant_text: "input_text.mono_calendar_assistant"
    assistant_image: ""
    newsletter: ""
    bedroom_temperature: ""
    bedroom_humidity: ""
    co2: ""
    pm25: ""
    pm1: ""
    pm10: ""
    hcho: ""
    tvoc: ""
    bedroom_light: ""
    desk_light: ""
    humidifier: ""
schema:
  display_token: "password(24,)"
  timezone: str
  temperature_unit: "list(°C|°F)"
  city: "str?"
  week_start: "int(0,1)"
  aqi_standard: "list(US)"
  aqi_input_standard: "list(US|CN2012|CN2026)"
  aqi_cn_period: "str?"
  llm_api_key: "password?"
  llm_base_url: url
  assistant_prompt: "str(,20000)?"
  llm_model: "str?"
  llm_thinking: bool
  llm_reasoning_effort: "list(low|high|max)"
  llm_max_tokens: "int(0,393216)"
  calendars:
    - str
  assistant_entities:
    - str
  assistant_presence_entities:
    - str
  assistant_news_mode: "list(off|morning|morning_and_major)"
  assistant_news_interval_hours: "int(1,168)"
  assistant_screen_times:
    - str
  assistant_screen_min_minutes: "int(0,1440)"
  assistant_screen_max_per_hour: "int(1,60)"
  assistant_screen_quiet_start: str
  assistant_screen_quiet_end: str
  assistant_context_tokens: "int(16384,131072)"
  assistant_memory_ttl_days: "int(1,365)"
  entities:
    climate: str
    living_temperature: str
    living_humidity: str
    outdoor_temperature: str
    outdoor_humidity: str
    outdoor_aqi: str
    outdoor_pm25_24h: str
    outdoor_pm10_24h: str
    outdoor_aqi_primary: str
    weather: str
    weather_alert: str
    assistant_text: str
    assistant_image: str
    newsletter: str
    bedroom_temperature: str
    bedroom_humidity: str
    co2: str
    pm25: str
    pm1: str
    pm10: str
    hcho: str
    tvoc: str
    bedroom_light: str
    desk_light: str
    humidifier: str
